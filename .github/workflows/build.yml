name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -e
          if [ -f "settings.gradle" ]; then
            echo "Project ditemukan di root repository."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f "build.zip" ]; then
            echo "build.zip ditemukan. Mengekstrak project..."
            mkdir -p "$GITHUB_WORKSPACE/project"
            unzip -o "$GITHUB_WORKSPACE/build.zip" -d "$GITHUB_WORKSPACE/project"
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan di dalam build.zip."
              find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          else
            echo "ERROR: Tidak menemukan settings.gradle atau build.zip."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/output/Kalkulator-Superior.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Superior-APK
          path: output/Kalkulator-Superior.apk
