name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project and build APK
        shell: bash
        run: |
          set -e
          SETTINGS_FILE="$(find . -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan. Pastikan isi ZIP di-upload, bukan folder pembungkus."
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/Kalkulator-Superior.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Superior-APK
          path: output/Kalkulator-Superior.apk
          if-no-files-found: error
